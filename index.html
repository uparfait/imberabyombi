<!doctype html>
<!--
  Imberabyombi · design-system template: a public website and a role-based admin in React + Tailwind CSS + Vite.
  This page holds what must exist before the app loads: SEO and social tags, structured data, fonts and a tiny
  theme boot that runs before the first paint, so there is never a light/dark flash.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imberabyombi</title>
<!-- SEO: description, robots, social cards. Updated per route by set_meta() (src/router/parse.js), canonical link included. -->
<meta name="description" content="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.">
<meta name="keywords" content="lorem, ipsum, dolor, sit, amet">
<meta name="robots" content="index,follow">
<meta name="author" content="Imberabyombi">
<meta name="theme-color" content="#E0661B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F1F" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Imberabyombi">
<meta property="og:description" content="Lorem ipsum dolor sit amet, consectetur adipiscing elit.">
<meta property="og:image" content="https://example.com/media/share_image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://example.com/">
<!-- Icons: the glossy "#" brand mark (src/icons/icon_3d.jsx, HASH), made with the Icon3D engine; .ico for older browsers -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Fonts: served with the site (src/styles/base/00_fonts.css): text shows at once, then the fonts swap in -->
<link rel="preload" href="/src/assets/fonts/figtree_latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- Theme boot: runs before the first paint so there is no light/dark flash. Mirrors set_theme() in the app. -->
<script>
  window.NS = 'loremds:v1:';
  (function () { try {
    var mode = JSON.parse(localStorage.getItem(NS + 'theme') || '"system"');
    var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  } catch (e) {} })();
</script>
<!-- Until the app's stylesheet arrives: the system's one segmented spinner, centred (same rules as
     src/styles/overrides/12_loading_spinner.css), and the keyboard-only "skip to content" link stays off
     screen (it slides in only when a keyboard user presses Tab, then jumps past the menus to the page content) -->
<style>
  html, body { margin: 0; background: #FAFAFA; } html.dark, html.dark body { background: #1F1F1F; }
  .boot_loader { position: fixed; inset: 0; display: grid; place-items: center; }
  .spinner_segmented_svg { width: 3.375rem; height: 3.375rem; flex-shrink: 0; animation: spin_rotate 2s linear infinite; }
  .spinner_segmented_dash { stroke: rgb(var(--spin, var(--brand, 224 102 27))); stroke-linecap: round; stroke-dasharray: 1, 200; animation: dash_pulse 1.5s ease-in-out infinite; }
  @keyframes spin_rotate { 100% { transform: rotate(360deg); } }
  @keyframes dash_pulse { 0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; } 50% { stroke-dasharray: 90, 200; stroke-dashoffset: -35; } 100% { stroke-dasharray: 90, 200; stroke-dashoffset: -125; } }
  .skip_link { position: fixed; z-index: 300; left: 1rem; top: -5rem; padding: .5rem 1rem; border: 0; border-radius: 999px;
    background: #E0661B; color: #fff; font: 600 .875rem/1.4 var(--font_sans, sans-serif); transition: top .2s; }
  .skip_link:focus { top: 1rem; outline: 2px solid #fff; outline-offset: 2px; }
</style>

<!-- Structured data for search engines -->
<script type="application/ld+json">
{ "@context": "https://schema.org", "@type": "Organization", "name": "Imberabyombi", "url": "https://example.com/",
  "logo": "https://example.com/media/logo.png", "description": "Lorem ipsum dolor sit amet, consectetur adipiscing elit." }
</script>
</head>

<body>
<noscript>
  <p style="padding:2rem;font-family:sans-serif">Turn on JavaScript to use this site.</p>
</noscript>

<button class="skip_link" data-act="scroll" data-to="main">Skip to content</button>

<!-- App root: every route renders here (src/main.jsx); the spinner shows until the first page is drawn -->
<div id="app"><div class="boot_loader" role="status" aria-label="Loading"><svg class="spinner_segmented_svg" viewBox="0 0 50 50" aria-hidden="true"><circle class="spinner_segmented_dash" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle></svg></div></div>

<!-- Shared overlays (one of each, reused by every module). React fills the dialogs; the rest is drawn by plain JS. -->
<dialog id="modal" aria-labelledby="modal_title"></dialog>
<dialog id="drawer" class="drawer" aria-label="Menu"></dialog>
<dialog id="viewer" aria-label="File viewer"></dialog>
<dialog id="confirm" aria-labelledby="confirm_title"></dialog>
<div id="loader" popover="manual" aria-hidden="true"><svg class="spinner_segmented_svg" viewBox="0 0 50 50"><circle class="spinner_segmented_dash" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle></svg></div>
<div id="picker" role="dialog" aria-label="Picker" hidden></div>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<div id="viz_tip" role="tooltip" aria-hidden="true"></div>
<div id="toasts" popover="manual" role="region" aria-label="Notifications" aria-live="polite"></div>

<!-- Templates: cloned by JS (a notification; the <ds-callout> web component's shadow DOM) -->
<template id="tpl_toast"><div class="toast"><span data-ico></span><div><p data-title></p><p data-msg></p></div><button type="button" data-close aria-label="Dismiss notification"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><span class="bar" aria-hidden="true"></span></div></template>
<template id="tpl_callout">
  <style>
    :host { display: block; border: 1px solid rgb(var(--line)); border-left: 4px solid rgb(var(--brand)); border-radius: var(--radius);
      padding: 1rem 1.25rem; background: rgb(var(--brand) / .06); font-family: var(--font_sans); }
    ::slotted([slot=title]) { margin: 0 0 .3rem; font-family: var(--font_display); color: rgb(var(--fg)); }
    .body { color: rgb(var(--muted)); line-height: 1.7; }
  </style>
  <slot name="title"></slot>
  <div class="body"><slot>Lorem ipsum dolor sit amet.</slot></div>
</template>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
