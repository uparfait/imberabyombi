<!doctype html>
<!--
  Imberabyombi · design-system template: a public website and a role-based admin in React + Tailwind CSS + Vite.
  This page holds what must exist before the app loads: SEO and social tags, structured data, fonts and a tiny
  theme boot that runs before the first paint, so there is never a light/dark flash.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imberabyombi</title>
<!-- SEO: description, robots, social cards. Updated per route by set_meta() (src/router/set_meta.js). -->
<meta name="description" content="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.">
<meta name="keywords" content="lorem, ipsum, dolor, sit, amet">
<meta name="robots" content="index,follow">
<meta name="author" content="Imberabyombi">
<meta name="theme-color" content="#E0661B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F1F" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Imberabyombi">
<meta property="og:description" content="Lorem ipsum dolor sit amet, consectetur adipiscing elit.">
<meta property="og:image" content="https://picsum.photos/seed/lorem-og/1200/630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://example.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Fonts: served with the site (src/styles/base/00_fonts.css): text shows at once, then the fonts swap in -->

<!-- Theme boot: runs before the first paint so there is no light/dark flash. Mirrors set_theme() in the app. -->
<script>
  window.NS = 'loremds:v1:';
  (function () { try {
    var mode = JSON.parse(localStorage.getItem(NS + 'theme') || '"system"');
    var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  } catch (e) {} })();
</script>

<!-- Structured data for search engines -->
<script type="application/ld+json">
{ "@context": "https://schema.org", "@type": "Organization", "name": "Imberabyombi", "url": "https://example.com/",
  "logo": "https://picsum.photos/seed/lorem-logo/512/512", "description": "Lorem ipsum dolor sit amet, consectetur adipiscing elit." }
</script>
</head>

<body>
<noscript>
  <p style="padding:2rem;font-family:sans-serif">Turn on JavaScript to use this site.</p>
</noscript>

<button class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[200] focus:rounded-full focus:bg-brand focus:px-4 focus:py-2 focus:text-white" data-act="scroll" data-to="main">Skip to content</button>

<!-- App root: every route renders here (src/main.jsx) -->
<div id="app"></div>

<!-- Shared overlays (one of each, reused by every module). React fills the dialogs; the rest is drawn by plain JS. -->
<dialog id="modal" aria-labelledby="modal_title"></dialog>
<dialog id="drawer" class="drawer" aria-label="Menu"></dialog>
<dialog id="viewer" aria-label="File viewer"></dialog>
<dialog id="confirm" aria-labelledby="confirm_title"></dialog>
<div id="loader" popover="manual" aria-hidden="true"><svg class="spinner_segmented_svg" viewBox="0 0 50 50"><circle class="spinner_segmented_dash" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle></svg></div>
<div id="picker" role="dialog" aria-label="Picker" hidden></div>
</html>
