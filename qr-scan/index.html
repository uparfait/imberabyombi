<!doctype html>
<!-- qr-scan/index.html: Qr-scan, a small app of its own on this site (/qr-scan/): it scans QR codes and opens secure links
     (https) in a new tab. Installable on its own (public/qr-scan/manifest.webmanifest, sw.js); code in src/qr/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qr-scan</title>
<meta name="description" content="Scan a QR code. Secure links (https) open in a new tab.">
<meta name="theme-color" content="#E0661B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F1F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qr-scan">
<link rel="manifest" href="/qr-scan/manifest.webmanifest">
<link rel="icon" href="/qr-scan/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/qr-scan/icon-192.png">
<link rel="preload" href="/src/assets/fonts/figtree_latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- the site's theme (light, dark or the system's), before the first paint -->
<script>
  (function () { try {
    var mode = JSON.parse(localStorage.getItem('loremds:v1:theme') || '"system"');
    document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
  } catch (e) {} })();
